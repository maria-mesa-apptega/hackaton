version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/client:/app
      - /app/node_modules
      - ./package.json:/app/../../package.json
      - ./turbo.json:/app/../../turbo.json
    environment:
      - NODE_ENV=development
    networks:
      - hackaton-network

